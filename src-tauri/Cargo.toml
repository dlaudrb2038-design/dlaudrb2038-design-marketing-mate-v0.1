[package]
name = "marketing-mate"
version = "0.1.0"
description = "MARKETING MATE Phase 1 desktop foundation"
edition = "2021"
rust-version = "1.99"

[lib]
name = "marketing_mate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.2"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.27.0", features = ["v4"] }
sha2 = "=0.11.0"

[dev-dependencies]
tempfile = "=3.27.0"
